name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.9.26"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install Python
        run: uv python install 3.14
      - name: Install dependencies
        run: uv sync --project backend --frozen
      - name: Lint backend
        run: uv run --project backend --frozen ruff check backend/app backend/tests
      - name: Test backend
        run: uv run --project backend --frozen pytest backend/tests
      - name: Check frontend syntax
        run: |
          for file in EarthAnalyser/frontend/js/*.js EarthSearch/frontend/main.js EarthMapper/frontend/main.js; do
            node --input-type=module --check < "$file"
          done
