<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EarthMapper</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Space+Grotesk:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css"
      crossorigin=""
    />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css"
      crossorigin=""
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="panel">
        <h1>EarthMapper</h1>
        <p class="subtitle">Viewport-driven feature loading from FastAPI</p>
        <nav class="app-nav" aria-label="Explore apps">
          <a href="/">Analyse</a>
          <a href="/search/">Search</a>
          <a href="/mapper/" aria-current="page">Map</a>
        </nav>

        <form id="filters-form" class="filters" autocomplete="off">
          <label for="category">Category</label>
          <select id="category" name="category">
            <option value="places" selected>places</option>
            <option value="hydrography">hydrography</option>
            <option value="administrative">administrative</option>
            <option value="terrain">terrain</option>
            <option value="transport">transport</option>
            <option value="regions">regions</option>
            <option value="landmarks">landmarks</option>
          </select>

          <button type="submit" id="reload-btn">Reload viewport</button>
        </form>

        <div class="stats" id="stats">Move map to load features...</div>
      </aside>

      <main>
        <div id="map"></div>
      </main>
    </div>

    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <script
      src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"
      crossorigin=""
    ></script>
    <script src="main.js?v=20260618-02" type="module"></script>
  </body>
</html>
