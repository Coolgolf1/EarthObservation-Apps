# Ruff configuration for the repo (backend + scripts).
# CI runs Ruff linting; formatting is not yet enforced.
target-version = "py314"
line-length = 100

extend-exclude = [
    ".venv",
    "**/.venv",
    "*.ipynb",
    "**/uv.lock",
]

[lint]
# A pragmatic starter set: pyflakes (F), a subset of pycodestyle (E),
# import sorting (I), pyupgrade (UP) and common bugbears (B).
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
# Line length is enforced by the formatter, not the linter; the codebase has
# many long descriptive lines that are not worth churning right now.
ignore = ["E501"]

[lint.per-file-ignores]
# Tests use fixtures and access intentionally "private" helpers.
"backend/tests/*" = ["E402"]

[format]
quote-style = "double"
