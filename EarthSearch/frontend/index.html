<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EarthSearch</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Space+Grotesk:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="panel">
        <h1>EarthSearch</h1>
        <p class="subtitle">Search-first frontend for fast streamed map loading</p>

        <form id="search-form" class="filters" autocomplete="off">
          <label for="place-query">Place (natural language)</label>
          <input
            id="place-query"
            name="place_query"
            type="text"
            value="Valencia, Spain"
            placeholder="e.g., Statue of Liberty"
            required
          />

          <label for="minutes">Reach time (minutes)</label>
          <input id="minutes" name="minutes" type="number" min="1" max="240" value="35" />

          <label for="vehicle">Vehicle</label>
          <select id="vehicle" name="vehicle">
            <option value="walking">walking</option>
            <option value="cycling">cycling</option>
            <option value="driving" selected>driving</option>
            <option value="driving-hgv">driving-hgv</option>
          </select>

          <label for="search-bbox">Optional bbox override</label>
          <input
            id="search-bbox"
            name="search_bbox"
            type="text"
            placeholder="min_lon,min_lat,max_lon,max_lat"
          />

          <button type="submit">Run search</button>
        </form>

        <div class="stats" id="stats">Run a search to stream features...</div>
      </aside>

      <main>
        <div id="map"></div>
      </main>
    </div>

    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <script src="main.js?v=20260611-01" type="module"></script>
  </body>
</html>
