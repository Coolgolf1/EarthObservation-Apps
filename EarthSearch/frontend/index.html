<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EarthSearch</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Space+Grotesk:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="panel">
        <h1>EarthSearch</h1>
        <p class="subtitle">Agentic map search with one prompt</p>

        <form id="search-form" class="filters" autocomplete="off">
          <label for="agent-prompt">Search prompt</label>
          <textarea
            id="agent-prompt"
            name="prompt"
            rows="4"
            placeholder="Optional if using drawn bbox. e.g., Valencia within 12 km or Valencia in 25 minutes by bicycle"
          >Valencia, Spain in 35 minutes by driving car</textarea>

          <label for="vehicle">Vehicle</label>
          <select id="vehicle" name="vehicle">
            <option value="walking">walking</option>
            <option value="cycling">cycling</option>
            <option value="driving" selected>driving</option>
            <option value="driving-hgv">driving-hgv</option>
          </select>

          <label for="area-value" id="area-value-label">Time (minutes)</label>
          <div class="area-controls">
            <button type="button" id="area-mode-toggle" class="mode-toggle" aria-pressed="false">Switch to Km</button>
            <input id="area-value" name="area_value" type="number" min="1" max="240" value="30" />
          </div>

          <label>Polygon selection</label>
          <div class="bbox-controls">
            <button type="button" id="bbox-draw-toggle" class="mode-toggle" aria-pressed="false">Start Polygon Select</button>
            <button type="button" id="bbox-clear" class="mode-toggle">Clear Polygon</button>
          </div>

          <button type="submit">Run agentic search</button>
        </form>

        <div class="stats" id="stats">Run a search to stream features...</div>
      </aside>

      <main>
        <div class="map-wrap">
          <div id="map"></div>
          <div id="confirm-point-wrap" class="confirm-point-wrap hidden">
            <button type="button" id="confirm-point-btn" class="confirm-point-btn">Confirm</button>
          </div>
        </div>
      </main>
    </div>

    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <script src="main.js?v=20260611-01" type="module"></script>
  </body>
</html>
