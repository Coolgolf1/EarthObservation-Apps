readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "adlfs>=2026.5.0",
    "dash>=4.2.0",
    "dask>=2026.6.0",
    "fsspec>=2026.6.0",
    "ipykernel>=7.3.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.0",
    "planetary-computer>=1.0.0",
    "plotly>=6.8.0",
    "pystac>=1.14.3",
    "pystac-client>=0.9.0",
    "rasterio>=1.4.0",
    "rich>=14.1.0",
    "xarray>=2026.4.0",
    "zarr>=3.2.1",
]
